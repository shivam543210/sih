version: '3.8'

services:
  dna-classifier:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

networks:
  default:
    name: dna-classifier-network
